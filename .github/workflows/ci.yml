name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test coverage
        run: npm run test:coverage

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wordle-helper-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wordle-helper-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14
