<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Wordle Helper logo</title>
  <desc id="desc">A premium word tile logo with green and yellow tiles and a checkmark.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="24" x2="272" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fff8"/>
      <stop offset="0.46" stop-color="#e6f3ea"/>
      <stop offset="1" stop-color="#dceaf5"/>
    </linearGradient>
    <linearGradient id="greenTile" x1="77" y1="62" x2="219" y2="232" gradientUnits="userSpaceOnUse">
